.c { font-family: "Times New Roman", Times, serif; font-size: 10px; font-weight: bold; }
.n rect, .n polygon { fill: #ffffff; stroke: #000000; stroke-width: 1; }
.n path, .g path { fill: none; stroke: #000000; stroke-width: 1; }
.cl { fill: none; stroke: #808080; stroke-width: 1; stroke-dasharray: 5 2; }
</style>
</defs>
