<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="648" viewBox="0 0 1200 648" role="img" aria-labelledby="title desc">
<title id="title">piecewise_chain: one shared return in the two IRs of the same program</title>
<desc id="desc">Two control-flow graphs of the worker function of the program piecewise_chain, drawn side by side; both omit the module block. Panel (a), the disassembly-path IR with straight-line chains contracted: B1 to B3 store the arguments in r0 and r1 and set r2 and r3 to 0; branch B4 (r0 &lt; r3) leads on T to the then-arm B5 to B7 and on F to B8 to B9 (r3 = 0; r0 == r3), which leads on T to B10 to B12 and on F to B13 (r0 &lt;= r1), which leads on T to B14 to B17 and on F to B18. B7, B12 and B17 jump to the shared return block B19 (return r2) and B18 falls through to it, so B19, drawn with a double border, has four predecessors, B7, B12, B17 and B18, and its immediate dominator is B4. Panel (b), the source-path IR of the same program: B1 (selector &lt; 0) leads to B2 and B3, B3 (selector == 0) leads to B4 and B5, B5 (selector &lt;= budget) leads to B6 and B7; B6 and B7 meet at B8, the join of B5; B4 and B8 meet at B9, the join of B3; B2 and B9 meet at B10, the join of B1, which holds the single return of result and is drawn with a double border, so B10 has two predecessors. Note below the panels: the compiler shares one return block, B19, among the four arms while the source IR joins them level by level; the backend must recognise B4 as the owner of the join B19, and the paired test checks all four arms under the VM.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4 Z" fill="#000000" stroke="none"/></marker>
