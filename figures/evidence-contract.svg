<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="791" viewBox="0 0 1200 791">
<title>The lifter_ir_v1 contract: frontends, handoff, and backend gates</title>
<desc>Classic engineering diagram of the lifter_ir_v1 contract. Left, a dashed cluster of frontends: the AST frontend (luau-ast parses the source, luau/lift_source.luau lifts the syntax tree, one source_span evidence record per parser span); the disassembly frontend (luau-compile --text --dump-constants -O0 -g0 writes the listing, the adapter research/compiler_disassembly_adapter.mjs turns it into a compiler_disassembly_handoff_v2 record, the bridge research/lift_compiler_disassembly.luau lifts that record, one decoded_record per listing line); and a dotted box for any other frontend that emits lifter_ir_v1, joined by a dotted edge. All three feed the centre record, the lifter_ir_v1 handoff: functions, blocks, instructions; values, places, packs, closures; provenance; the 7 evidence kinds source_span, decoded_record, dynamic_fixture, frontend_proof, solver_certificate, conformance_oracle, structural_derivation; and the 12 obligation kinds missing_semantics, unresolved_identity, unknown_effects, effect_proof, dispatch_proof, primitive_domain, unknown_arity, alias_proof, control_structure, closure_ownership, numeric_domain, target_support. The handoff enters a dashed cluster of backend gates, top to bottom, joined by solid edges labelled core-admitted, resolved, emission-admitted, normalized, planned and emitted: core admission (validate &lt;ir&gt; core); checked resolution (resolve-admitted-readable-ir &lt;ir&gt; &lt;admitted&gt;, internal facts, z3 through resolve-ir, certificates, models, unsat cores, replayable CFG rewrites); emission admission (validate &lt;admitted&gt; readable-luau: evidence on every emitted entity, known effect precision, open obligations, compiler limits); normalization (normalize-ir &lt;admitted&gt; &lt;normalized&gt;, guarded node splitting toward reducibility, node_split rewrites, the output re-validated under core); structuring by the planner (structure.Plan in src/structure.zig), whose first field is the emitting command re-checking readable-luau on the normalized IR before planning, refusing control with no plan, not even a dispatcher, as unsupported_readable_control_flow and irreducible_control_entry, and whose second field is the planning itself: regions, or a whole-function dispatcher fallback; emission (emit-luau &lt;ir&gt; &lt;out.luau&gt; &lt;target&gt; &lt;compiler&gt;, automatic, with emit-readable-luau-strategy for the forced dispatcher control); and the compile check (luau-compile --null on the staged output). Each gate has a side edge, labelled refuse, error/refuse, typed error or rejected, into one double-bordered sink (the side edge of structuring leaves from its re-check field), the typed diagnostic: diagnostic=&lt;code&gt; entity=&lt;index&gt;, for an obligation also obligation_kind, blocks_profile and obligation_provenance, a typed error for normalization and emission, exit status 1 and no output. An edge labelled accepted leads from the compile check to the double-bordered published Luau box (&lt;out.luau&gt;).</desc>
<defs>
<marker id="ah" viewBox="0 0 6 4" refX="0" refY="2" markerWidth="6" markerHeight="4" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,2 L0,4 z" fill="#000"/></marker>
<style>
text{fill:#000}
.ti{font-family:Times New Roman,Times,serif;font-size:13px;font-weight:bold}
.ct{font-family:Times New Roman,Times,serif;font-size:10px;font-weight:bold}
.l{font-family:Times New Roman,Times,serif;font-size:11px}
.m{font-family:Courier New,Courier,monospace;font-size:10px}
.e{font-family:Times New Roman,Times,serif;font-size:9px;font-style:italic}
.b,.b2{fill:#fff;stroke:#000;stroke-width:1}
.w{fill:#fff;stroke:#000;stroke-width:1;stroke-dasharray:1 2}
.c{fill:none;stroke:#808080;stroke-width:1;stroke-dasharray:4 3}
.r{stroke:#000;stroke-width:1}
.ed{fill:none;stroke:#000;stroke-width:1}
.dt{stroke-dasharray:1 2}
</style>
</defs>
<rect x="0" y="0" width="1200" height="791" fill="#fff"/>
<text class="ti" x="16" y="24">The lifter_ir_v1 contract: frontends, handoff, and backend gates</text>
<g id="cluster-frontends"><rect class="c" x="16.5" y="40.5" width="251" height="374"/>
<text class="ct" x="22" y="53">frontends</text></g>
<g id="cluster-backend-gates"><rect class="c" x="544.5" y="40.5" width="358" height="733"/>
<text class="ct" x="550" y="53">backend gates</text></g>
<g id="frontend-ast">
<rect class="b" x="35.5" y="60.5" width="214" height="83"/>
<text class="l" x="142.5" y="74" text-anchor="middle">AST frontend</text>
<line class="r" x1="35" y1="81.5" x2="250" y2="81.5"/>
<text class="l" x="43" y="95">parser: <tspan class="m">luau-ast &lt;source.luau&gt;</tspan></text>
<line class="r" x1="35" y1="102.5" x2="250" y2="102.5"/>
<text class="l" x="43" y="116">lift: <tspan class="m">luau/lift_source.luau</tspan></text>
<line class="r" x1="35" y1="123.5" x2="250" y2="123.5"/>
<text class="l" x="43" y="137">evidence: one <tspan class="m">source_span</tspan> per parser span</text>
</g>
<g id="frontend-disassembly">
<rect class="b" x="24.5" y="176.5" width="235" height="177"/>
<text class="l" x="142" y="190" text-anchor="middle">disassembly frontend</text>
<line class="r" x1="24" y1="197.5" x2="260" y2="197.5"/>
<text class="l" x="32" y="211">listing:</text>
<text class="m" x="32" y="224">luau-compile --text --dump-constants</text>
<text class="m" x="32" y="237">-O0 -g0 &lt;source.luau&gt;</text>
<line class="r" x1="24" y1="244.5" x2="260" y2="244.5"/>
<text class="l" x="32" y="258">adapter (in <tspan class="m">research/</tspan>):</text>
<text class="m" x="32" y="271">compiler_disassembly_adapter.mjs</text>
<line class="r" x1="24" y1="278.5" x2="260" y2="278.5"/>
<text class="l" x="32" y="292">record: <tspan class="m">compiler_disassembly_handoff_v2</tspan></text>
<line class="r" x1="24" y1="299.5" x2="260" y2="299.5"/>
<text class="l" x="32" y="313">bridge (in <tspan class="m">research/</tspan>):</text>
<text class="m" x="32" y="326">lift_compiler_disassembly.luau</text>
<line class="r" x1="24" y1="333.5" x2="260" y2="333.5"/>
<text class="l" x="32" y="347">evidence: one <tspan class="m">decoded_record</tspan> per listing line</text>
</g>
<g id="frontend-other">
<rect class="w" x="62.5" y="386.5" width="160" height="20"/>
<text class="l" x="142.5" y="400" text-anchor="middle">other frontends, same handoff</text>
</g>
<g id="handoff">
<rect class="b" x="304.5" y="60.5" width="207" height="346"/>
<text class="m" x="408" y="74" text-anchor="middle">lifter_ir_v1<tspan class="l"> handoff</tspan></text>
<line class="r" x1="304" y1="81.5" x2="512" y2="81.5"/>
<text class="l" x="339" y="95" text-anchor="middle">functions</text>
<line class="r" x1="374.5" y1="81" x2="374.5" y2="102"/>
<text class="l" x="402.5" y="95" text-anchor="middle">blocks</text>
<line class="r" x1="431.5" y1="81" x2="431.5" y2="102"/>
<text class="l" x="471.5" y="95" text-anchor="middle">instructions</text>
<line class="r" x1="304" y1="102.5" x2="512" y2="102.5"/>
<text class="l" x="329.5" y="116" text-anchor="middle">values</text>
<line class="r" x1="355.5" y1="102" x2="355.5" y2="123"/>
<text class="l" x="380" y="116" text-anchor="middle">places</text>
<line class="r" x1="405.5" y1="102" x2="405.5" y2="123"/>
<text class="l" x="429" y="116" text-anchor="middle">packs</text>
<line class="r" x1="453.5" y1="102" x2="453.5" y2="123"/>
<text class="l" x="482.5" y="116" text-anchor="middle">closures</text>
<line class="r" x1="304" y1="123.5" x2="512" y2="123.5"/>
<text class="l" x="408" y="137" text-anchor="middle">provenance</text>
<line class="r" x1="304" y1="144.5" x2="512" y2="144.5"/>
<text class="l" x="336.5" y="190.5" text-anchor="middle">evidence</text>
<text class="l" x="336.5" y="203.5" text-anchor="middle">(7 kinds)</text>
<line class="r" x1="369.5" y1="144" x2="369.5" y2="243"/>
<text class="m" x="377" y="158">source_span</text>
<text class="m" x="377" y="171">decoded_record</text>
<text class="m" x="377" y="184">dynamic_fixture</text>
<text class="m" x="377" y="197">frontend_proof</text>
<text class="m" x="377" y="210">solver_certificate</text>
<text class="m" x="377" y="223">conformance_oracle</text>
<text class="m" x="377" y="236">structural_derivation</text>
<line class="r" x1="304" y1="243.5" x2="512" y2="243.5"/>
<text class="l" x="336.5" y="322" text-anchor="middle">obligations</text>
<text class="l" x="336.5" y="335" text-anchor="middle">(12 kinds)</text>
<line class="r" x1="369.5" y1="243" x2="369.5" y2="407"/>
<text class="m" x="377" y="257">missing_semantics</text>
<text class="m" x="377" y="270">unresolved_identity</text>
<text class="m" x="377" y="283">unknown_effects</text>
<text class="m" x="377" y="296">effect_proof</text>
<text class="m" x="377" y="309">dispatch_proof</text>
<text class="m" x="377" y="322">primitive_domain</text>
<text class="m" x="377" y="335">unknown_arity</text>
<text class="m" x="377" y="348">alias_proof</text>
<text class="m" x="377" y="361">control_structure</text>
<text class="m" x="377" y="374">closure_ownership</text>
<text class="m" x="377" y="387">numeric_domain</text>
<text class="m" x="377" y="400">target_support</text>
</g>
<g id="gate-core-admission">
<rect class="b" x="569.5" y="60.5" width="310" height="54"/>
<text class="l" x="636.5" y="74" text-anchor="middle">core admission</text>
<line class="r" x1="704.5" y1="60" x2="704.5" y2="81"/>
<text class="m" x="792" y="74" text-anchor="middle">validate &lt;ir&gt; core</text>
<line class="r" x1="569" y1="81.5" x2="880" y2="81.5"/>
<text class="l" x="577" y="95">IDs, types, membership, closures, operations, effects, packs,</text>
<text class="l" x="577" y="108">dominance, proof records; an open obligation naming <tspan class="m">core</tspan> blocks</text>
</g>
<g id="gate-checked-resolution">
<rect class="b" x="570.5" y="139.5" width="307" height="93"/>
<text class="l" x="625.5" y="159.5" text-anchor="middle">checked resolution</text>
<line class="r" x1="681.5" y1="139" x2="681.5" y2="173"/>
<text class="m" x="779.5" y="153" text-anchor="middle">resolve-admitted-readable-ir</text>
<text class="m" x="779.5" y="166" text-anchor="middle">&lt;ir&gt; &lt;admitted&gt;</text>
<line class="r" x1="570" y1="173.5" x2="878" y2="173.5"/>
<text class="l" x="578" y="187">engine: internal facts (<tspan class="m">z3</tspan> through <tspan class="m">resolve-ir</tspan>); a known answer</text>
<text class="l" x="578" y="200">becomes a certificate, model or unsat core with a digest; only</text>
<text class="l" x="578" y="213">proved facts change the program, as replayable CFG rewrites;</text>
<text class="l" x="578" y="226">an unknown answer leaves its obligation open</text>
</g>
<g id="gate-emission-admission">
<rect class="b" x="565.5" y="257.5" width="317" height="80"/>
<text class="l" x="616.5" y="271" text-anchor="middle">emission admission</text>
<line class="r" x1="668.5" y1="257" x2="668.5" y2="278"/>
<text class="m" x="775.5" y="271" text-anchor="middle">validate &lt;admitted&gt; readable-luau</text>
<line class="r" x1="565" y1="278.5" x2="883" y2="278.5"/>
<text class="l" x="573" y="292">evidence on every emitted entity; known effect precision; open</text>
<text class="l" x="573" y="305">obligations block (emission-only ones while their subject is</text>
<text class="l" x="573" y="318">reachable); compiler limits: registers, upvalues, child prototypes,</text>
<text class="l" x="573" y="331">syntax depth, jump distance</text>
</g>
<g id="gate-normalization">
<rect class="b" x="569.5" y="362.5" width="310" height="80"/>
<text class="l" x="608" y="376" text-anchor="middle">normalization</text>
<line class="r" x1="647.5" y1="362" x2="647.5" y2="383"/>
<text class="m" x="763.5" y="376" text-anchor="middle">normalize-ir &lt;admitted&gt; &lt;normalized&gt;</text>
<line class="r" x1="569" y1="383.5" x2="880" y2="383.5"/>
<text class="l" x="577" y="397">guarded node splitting toward reducibility (entry repair, structural</text>
<text class="l" x="577" y="410">overlap, structure feedback), budgeted; each redirected edge is a</text>
<text class="m" x="577" y="423">node_split<tspan class="l"> rewrite that validation replays; the output is</tspan></text>
<text class="l" x="577" y="436">re-validated under <tspan class="m">core</tspan></text>
</g>
<g id="gate-structuring">
<rect class="b" x="554.5" y="467.5" width="339" height="140"/>
<text class="l" x="615.5" y="481" text-anchor="middle">structuring (the planner)</text>
<line class="r" x1="677.5" y1="467" x2="677.5" y2="488"/>
<text class="m" x="785.5" y="481" text-anchor="middle">structure.Plan<tspan class="l"> in </tspan>src/structure.zig</text>
<line class="r" x1="554" y1="488.5" x2="894" y2="488.5"/>
<text class="l" x="562" y="502">before planning, the emitting command re-checks <tspan class="m">readable-luau</tspan></text>
<text class="l" x="562" y="515">on the normalized IR; control with no plan, not even a</text>
<text class="l" x="562" y="528">dispatcher, is refused: <tspan class="m">unsupported_readable_control_flow</tspan>,</text>
<text class="m" x="562" y="541">irreducible_control_entry</text>
<line class="r" x1="554" y1="548.5" x2="894" y2="548.5"/>
<text class="l" x="562" y="562">regions become nested <tspan class="m">if</tspan>, <tspan class="m">while true</tspan> with <tspan class="m">break</tspan> and <tspan class="m">continue</tspan>,</text>
<text class="m" x="562" y="575">for<tspan class="l"> loops and escape flags; an unsupported shape, a rejected</tspan></text>
<text class="l" x="562" y="588">plan or, with CFG rewrites, a block-count cap sends the whole</text>
<text class="l" x="562" y="601">function to a dispatcher</text>
</g>
<g id="gate-emission">
<rect class="b" x="553.5" y="632.5" width="342" height="67"/>
<text class="l" x="581" y="646" text-anchor="middle">emission</text>
<line class="r" x1="609.5" y1="632" x2="609.5" y2="653"/>
<text class="m" x="752.5" y="646" text-anchor="middle">emit-luau &lt;ir&gt; &lt;out.luau&gt; &lt;target&gt; &lt;compiler&gt;</text>
<line class="r" x1="553" y1="653.5" x2="896" y2="653.5"/>
<text class="l" x="561" y="667">automatic: planned regions, a dispatcher where planning fails;</text>
<text class="l" x="561" y="680">forced dispatcher control on the same IR:</text>
<text class="m" x="561" y="693">emit-readable-luau-strategy … dispatcher</text>
</g>
<g id="gate-compile-check">
<rect class="b" x="577.5" y="724.5" width="294" height="41"/>
<text class="l" x="617" y="738" text-anchor="middle">compile check</text>
<line class="r" x1="657.5" y1="724" x2="657.5" y2="745"/>
<text class="m" x="764.5" y="738" text-anchor="middle">luau-compile --null &lt;staged.luau&gt;</text>
<line class="r" x1="577" y1="745.5" x2="872" y2="745.5"/>
<text class="l" x="585" y="759">the compiler accepts the output, or nothing is published</text>
</g>
<g id="typed-diagnostic">
<rect class="b" x="960.5" y="371.5" width="214" height="188"/>
<rect class="b2" x="963.5" y="374.5" width="208" height="182"/>
<text class="l" x="1067.5" y="388" text-anchor="middle">typed diagnostic</text>
<line class="r" x1="963" y1="395.5" x2="1172" y2="395.5"/>
<text class="l" x="971" y="409">code + entity:</text>
<text class="m" x="971" y="422">diagnostic=&lt;code&gt; entity=&lt;index&gt;</text>
<line class="r" x1="963" y1="429.5" x2="1172" y2="429.5"/>
<text class="l" x="971" y="443">for an obligation: kind, blocked</text>
<text class="l" x="971" y="456">profile and provenance:</text>
<text class="m" x="971" y="469">obligation_kind=&lt;kind&gt;</text>
<text class="m" x="971" y="482">blocks_profile=&lt;profile&gt;</text>
<text class="m" x="971" y="495">obligation_provenance=&lt;locator&gt;</text>
<line class="r" x1="963" y1="502.5" x2="1172" y2="502.5"/>
<text class="l" x="971" y="516">typed error (normalization, emission):</text>
<text class="m" x="971" y="529">error: &lt;name&gt;</text>
<line class="r" x1="963" y1="536.5" x2="1172" y2="536.5"/>
<text class="l" x="971" y="550">exit status 1; no output is written</text>
</g>
<g id="published-luau">
<rect class="b" x="363.5" y="735.5" width="90" height="39"/>
<rect class="b2" x="366.5" y="738.5" width="84" height="33"/>
<text class="l" x="408.5" y="752" text-anchor="middle">published Luau</text>
<text class="m" x="408.5" y="765" text-anchor="middle">&lt;out.luau&gt;</text>
</g>
